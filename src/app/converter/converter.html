<h2>Omvandlare</h2>

<div class="converter">

<label>
    Värde: <br>
    <input type="number" id="value" [(ngModel)]="value">
</label>

<label>
    Omvandling: <br>
    <select [(ngModel)]="method">
        <option value="" disabled>Välj metod</option>
        <option value="MtoF">Meter till fot</option>
        <option value="CtoF">Celsius till Fahrenheit</option>
        <option value="KgtoLbs">Kilogram till Pounds</option>
    </select>
</label>

<button (click)="convertValue()">Omvandla</button>

<p class="result"><strong>Resultat:</strong> {{ result }} </p>

</div>
